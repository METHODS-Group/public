name: Sign up for an interview presentation (postdoc search)
description: Take a research presentation slot for the METHODS Group postdoc interviews. Start from the sign-up page so the slot is filled in for you.
title: "Interview: "
labels: [interview]
body:
  - type: markdown
    attributes:
      value: Everything you enter here appears on the public sign-up page. You can change it later with **Edit my sign-up** on that page.
  - type: input
    id: slot
    attributes:
      label: Slot
      description: Filled in from the sign-up page; leave it as is
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Your name
      description: As you would like it shown on the sign-up page
    validations:
      required: true
  - type: input
    id: talk_title
    attributes:
      label: Presentation title
    validations:
      required: true
  - type: textarea
    id: abstract
    attributes:
      label: Abstract
      description: About 150 to 250 words, for the talk announcement. Math in $...$ is typeset on the page.
    validations:
      required: true
